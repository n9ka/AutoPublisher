name: Article Processor
on:
  schedule:
    - cron: '45 4,12,20 * * *' # 15 min après le détecteur, hors périodes peak DeepSeek (UTC)
  workflow_dispatch:

jobs:
  process-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Capture runner public IP
        shell: bash
        run: |
          RUNNER_PUBLIC_IP="$(curl -4 -fsS https://api.ipify.org || curl -4 -fsS https://ifconfig.me || echo unknown)"
          echo "RUNNER_PUBLIC_IP=$RUNNER_PUBLIC_IP" >> "$GITHUB_ENV"
          echo "Runner public IP: $RUNNER_PUBLIC_IP"

      - name: Enforce DeepSeek off-peak window
        id: deepseek-window
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          hour="$(date -u +%H)"
          minute="$(date -u +%M)"
          now_minutes=$((10#$hour * 60 + 10#$minute))
          should_process=true
          reason=""

          # Peak DeepSeek (UTC): 01:00–04:00 and 06:00–10:00.
          # The 05:00–06:00 buffer prevents a 45-minute processor run from crossing into peak.
          if (( now_minutes >= 60 && now_minutes < 240 )); then
            should_process=false
            reason="période peak DeepSeek"
          elif (( now_minutes >= 300 && now_minutes < 600 )); then
            should_process=false
            reason="fenêtre tampon avant ou pendant la période peak DeepSeek"
          fi

          echo "should_process=$should_process" >> "$GITHUB_OUTPUT"

          if [[ "$should_process" == "false" ]]; then
            message="⏸️ Processor DeepSeek reporté à ${hour}:${minute} UTC : ${reason}. Aucun article n'a été traité ; le prochain cycle reprendra les jobs en attente."
            echo "$message"

            if [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
              curl --fail --silent --show-error --max-time 10 --retry 2 \
                -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${message}" \
                --data-urlencode "disable_web_page_preview=true" \
                --output /dev/null \
                || echo "::warning::Telegram notification failed."
            else
              echo "::warning::Telegram credentials are not configured."
            fi
          fi
      
      - name: Process Next Article
        if: steps.deepseek-window.outputs.should_process == 'true'
        run: node src/processor.js
        env:
          RUNNER_PUBLIC_IP: ${{ env.RUNNER_PUBLIC_IP }}
          WP_HEADER_PROFILE: ${{ vars.WP_HEADER_PROFILE || 'default' }}
          PUBLISH_CACHE_DATABASE_URL: ${{ secrets.PUBLISH_CACHE_DATABASE_URL }}
          PUBLISH_CACHE_ENABLED: ${{ vars.PUBLISH_CACHE_ENABLED || 'true' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_AI_API_KEY_3: ${{ secrets.GOOGLE_AI_API_KEY_3 }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_AI_API_KEY_2: ${{ secrets.GOOGLE_AI_API_KEY_2 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DRY_RUN: 'false'
          MAX_ARTICLES_PER_DAY: ${{ vars.MAX_ARTICLES_PER_DAY || '1' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
