name: Catalogue Vault Sync

on:
  schedule:
    - cron: '0 * * * *' # Toutes les heures
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout obsidian-vault
        uses: actions/checkout@v4
        with:
          repository: n9ka-ai/obsidian-vault
          token: ${{ secrets.N9KA_AI_PAT }}
          path: obsidian-vault

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync catalogue to vault
        run: node src/catalogue-vault-sync.js
        env:
          CATALOGUE_API_KEY: ${{ secrets.CATALOGUE_API_KEY }}
          CATALOGUE_BASE_URL: https://backlink.aspy.fr
          CATALOGUE_SLUGS: XhdEfou7
          OBSIDIAN_VAULT_PATH: ${{ github.workspace }}/obsidian-vault

      - name: Commit and push vault changes
        run: |
          cd obsidian-vault
          git config user.email "sync@aspy.fr"
          git config user.name "Aspy Sync"
          git add shared/catalogue-sites/
          git diff --cached --quiet && echo "Aucune modification." || (
            git commit -m "sync: catalogue $(date -u '+%Y-%m-%d %H:%M') UTC" &&
            git push
          )
