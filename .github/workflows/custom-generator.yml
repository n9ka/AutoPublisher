name: Custom SEO Generator
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID du job dans articles_queue'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capture runner public IP
        shell: bash
        run: |
          RUNNER_PUBLIC_IP="$(curl -4 -fsS https://api.ipify.org || curl -4 -fsS https://ifconfig.me || echo unknown)"
          echo "RUNNER_PUBLIC_IP=$RUNNER_PUBLIC_IP" >> "$GITHUB_ENV"
          echo "Runner public IP: $RUNNER_PUBLIC_IP"

      - name: Run Custom Generator
        run: node src/custom-generator.js ${{ github.event.inputs.job_id }}
        env:
          RUNNER_PUBLIC_IP: ${{ env.RUNNER_PUBLIC_IP }}
          WP_HEADER_PROFILE: ${{ vars.WP_HEADER_PROFILE || 'default' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_FALLBACK: ${{ secrets.TAVILY_API_KEY_FALLBACK }}
          GOOGLE_AI_API_KEY_3: ${{ secrets.GOOGLE_AI_API_KEY_3 }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_AI_API_KEY_2: ${{ secrets.GOOGLE_AI_API_KEY_2 }}
          CACHE_DB_URL: ${{ secrets.CACHE_DB_URL }}
          CACHE_DB_SERVICE_KEY: ${{ secrets.CACHE_DB_SERVICE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # OpenRouter = clé unique pour tous les modèles configurés en DB + fallback JSON repair
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPID_INDEXER_API_KEY: ${{ secrets.RAPID_INDEXER_API_KEY }}
