name: Custom SEO Generator
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID du job dans articles_queue'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Custom Generator
        run: node src/custom-generator.js ${{ github.event.inputs.job_id }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENCRYPTIONKEY: ${{ secrets.ENCRYPTIONKEY }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          CACHE_DB_URL: ${{ secrets.CACHE_DB_URL }}
          CACHE_DB_SERVICE_KEY: ${{ secrets.CACHE_DB_SERVICE_KEY }}
          # Clés providers LLM — seules celles configurées en DB sont nécessaires
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
